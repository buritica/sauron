# Prometheus Alert Rules - Sauron
# One does not simply ignore these alerts

groups:
  - name: sauron_critical
    interval: 30s
    rules:
      # Service is down
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been down for more than 2 minutes."

      # Container down
      - alert: ContainerDown
        expr: absent(container_last_seen{name!=""})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container monitoring unavailable"
          description: "cAdvisor is not reporting container metrics"

  - name: sauron_disk
    # Disk fills slowly — evaluate every 10m (not the global 15s). Cheaper and
    # avoids transient flapping. The for: debounces below still apply.
    interval: 10m
    rules:
      # Critical disk space
      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"}) < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical disk space on {{ $labels.mountpoint }}"
          description: "Disk space on {{ $labels.mountpoint }} is below 5% ({{ $value | humanizePercentage }})"

      # Warning disk space
      - alert: DiskSpaceWarning
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"}) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.mountpoint }}"
          description: "Disk space on {{ $labels.mountpoint }} is below 15% ({{ $value | humanizePercentage }})"

      # High inode usage
      - alert: HighInodeUsage
        expr: (node_filesystem_files_free / node_filesystem_files) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High inode usage on {{ $labels.mountpoint }}"
          description: "Inode usage on {{ $labels.mountpoint }} is above 90%"

  - name: sauron_memory
    interval: 1m
    rules:
      # Container high memory
      - alert: ContainerHighMemory
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes{container!=""}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high memory usage"
          description: "Container {{ $labels.name }} is using {{ $value | humanizePercentage }} of its memory limit"

      # Host high memory
      - alert: HostHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage critical"
          description: "Host memory usage is above 90% ({{ $value | humanizePercentage }})"

  - name: sauron_cpu
    interval: 1m
    rules:
      # High CPU usage
      - alert: HostHighCPU
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage has been above 80% for 10 minutes ({{ $value | humanize }}%)"

      # Container high CPU
      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{container!=""}[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high CPU"
          description: "Container {{ $labels.name }} CPU usage is high"

  - name: sauron_network
    interval: 1m
    rules:
      # High network errors
      - alert: HighNetworkErrors
        expr: rate(node_network_receive_errs_total[5m]) > 10 or rate(node_network_transmit_errs_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High network errors on {{ $labels.device }}"
          description: "Network interface {{ $labels.device }} is experiencing high error rates"

  - name: sauron_container_health
    interval: 1m
    rules:
      # Container restart-looping. The old expr `rate(container_last_seen[5m])`
      # was broken: container_last_seen is a wall-clock "last scraped" timestamp
      # that ticks up ~1/s for every RUNNING container, so its rate is ~1 for
      # everything healthy — it fired for all containers permanently and never
      # measured restarts. container_start_time_seconds changes only on an actual
      # (re)start; >2 changes in 15m = genuine crash loop (a single expected
      # restart, e.g. a deploy, is 1 change and stays silent).
      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is restart-looping"
          description: "Container {{ $labels.name }} restarted {{ $value }} times in the last 15 minutes"

  - name: ca_streaming
    interval: 1m
    rules:
      # Orphaned streaming cursor — THE BUG (ca #1657, fixed by #1659).
      # A stranded cursor (▌) left visible after a streaming finalize. In steady
      # state this counter never increases; any increase means the orphan-cursor
      # regression is back. ca.streaming.finalize{outcome="orphaned"} →
      # ca_streaming_finalize_total (OTLP dot→underscore + _total monotonic suffix,
      # same as ca.messages → ca_messages_total).
      - alert: OrphanedStreamingCursor
        expr: increase(ca_streaming_finalize_total{outcome="orphaned"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Orphaned streaming cursor in ca ({{ $labels.transport }})"
          description: "ca left {{ $value | humanize }} stranded streaming cursor(s) in the last 15m on {{ $labels.transport }} — the orphan-cursor bug (#1657) may have regressed despite the #1659 fix."

      # Deploy-restart stranded cursors above the inherent baseline (ca #1604/#1667).
      # DISTINCT from outcome="orphaned" (steady-state edit-fail, alerted at zero above).
      # ca auto-deploys and kills mid-stream within a bounded 3s finalize budget, so a
      # restart that lands mid-stream LEGITIMATELY strands a placeholder when the finalize
      # sweep times out — strands are inherent, NOT a regression. This must NOT be
      # zero-threshold: only fire when the rate exceeds normal deploy churn (> 3/h).
      - alert: OrphanedStreamingCursorOnRestart
        expr: sum(increase(ca_streaming_finalize_total{outcome="shutdown_orphaned"}[1h])) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated deploy-restart stranded streaming cursors in ca"
          description: "ca stranded {{ $value | humanize }} streaming cursor(s) via the shutdown finalize sweep in the last 1h — above the inherent deploy-restart baseline. Check whether deploys are landing mid-stream abnormally often, or whether the 3s finalize budget (#1604) is too tight. Distinct from the steady-state orphan-cursor bug (#1657)."

  - name: ca_brain_audit
    interval: 1m
    rules:
      # Mutation receipts default ON (ca #1795) — the shared audit-DB handle
      # (setAuditDb, registered once at daemon boot) is what every brain
      # writer resolves against. In steady state this counter never
      # increases; any increase means the handle registration was silently
      # dropped (a main.ts refactor regressing #1772/#1795) or a writer
      # bypassed the default-on contract. ca.brain.audit.skipped{kind} →
      # ca_brain_audit_skipped_total (OTLP dot→underscore + _total monotonic
      # suffix, same as ca.streaming.finalize → ca_streaming_finalize_total).
      # This is the CONTINUOUS backstop — ca's own post-deploy
      # brain-audit-freshness probe (ca #1794) is the one-shot gate at
      # deploy time; this catches drift between deploys.
      - alert: BrainAuditReceiptsSkipped
        expr: increase(ca_brain_audit_skipped_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Brain mutation receipts are being skipped in ca ({{ $labels.kind }})"
          description: "ca skipped {{ $value | humanize }} brain_audit receipt(s) for writer kind '{{ $labels.kind }}' in the last 1h — the audit trail may have gone silently unlogged. Check whether setAuditDb's shared handle registration (main.ts, right after migrations) is still intact."

      # Sustained audit-write failures (INSERT throws inside logBrainAudit's
      # own self-catch — audit failure must never roll back a real brain
      # mutation, so this is invisible to the writer). A single occurrence
      # is tolerated (transient SQLITE_BUSY, a momentary lock — same reason
      # ca's own post-deploy probe treats one as non-critical); only a
      # sustained pattern over an hour indicates a real problem with the
      # audit DB itself (disk, corruption, schema drift).
      - alert: BrainAuditWriteFailuresElevated
        expr: increase(ca_brain_audit_write_failed_total[1h]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated brain_audit write failures in ca"
          description: "ca failed {{ $value | humanize }} brain_audit INSERT(s) in the last 1h — above a single transient blip. Check disk space and the ca.db audit table."

  - name: ca_brain_rollback
    interval: 1m
    rules:
      # A brain doc mutation left the vault needing a HUMAN (ca #1750 + #2121).
      # archive/unarchive/move each rename a doc and then keep writing (wikilink
      # rewrite, frontmatter patch, log append); a throw after the rename
      # triggers a compensator. This counter fires ONLY when that compensator
      # itself failed — a cleanly-rolled-back forward failure is benign and
      # deliberately counts nothing. Steady state is zero; any increase is real.
      #
      # ca.brain.rollback_failed{op,outcome} → ca_brain_rollback_failed_total
      # (OTLP dot→underscore + _total monotonic suffix, same as
      # ca.brain.audit.skipped → ca_brain_audit_skipped_total). Replaces three
      # per-op counters that never had a rule — one labelled series so this
      # stays ONE rule as ops are added. `outcome` is grouped, not collapsed,
      # because it determines the remediation; the description spells each out.
      #
      # Primed with zeros at daemon boot (seedRollbackMetrics, right after
      # initTelemetry) so the series EXISTS at zero — without a prior sample
      # Prometheus cannot compute increase() over the first-ever increment and a
      # single isolated failure would never fire. Same rationale as
      # CaSpuriousDenyActive (below, ca_sdk_spurious_deny group).
      #
      # 24h window, NOT the 30m used by the regression-detector alerts above:
      # those detect "something started happening" and a quiet 30m genuinely IS
      # the resolution, so their auto-RESOLVED is honest. This one reports a
      # PERSISTENT state that nothing retries, so a short window would post a
      # green RESOLVED half an hour later with the vault still broken. 24h keeps
      # it firing for a day and matches the dashboard tiles.
      #
      # severity: critical because data is already inconsistent, vs the other ca
      # alerts which are regression detectors. NB this is a semantic label only:
      # there is one route and one receiver, so it does not currently escalate
      # or route differently (see README "Alert routing").
      #
      # The counter is in-process with a 30s export tick, so a failure that also
      # kills the daemon may never export. The durable record is the ca log line
      # the description points at — treat Loki, not this counter, as the source
      # of truth for whether an event happened.
      - alert: CaBrainRollbackFailed
        expr: sum by (op, outcome) (increase(ca_brain_rollback_failed_total[24h])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Brain {{ $labels.op }} rollback failed in ca ({{ $labels.outcome }})"
          description: "ca's {{ $labels.op }} compensator failed {{ $value | humanize }} time(s) in the last 24h with outcome '{{ $labels.outcome }}' — a doc mutation threw after the rename and could not be undone. NOT self-healing; nothing will retry it. doc_stranded = the doc sits at the DESTINATION path, do NOT re-run the command (a retry hits 'source not found'). links_dangling = the doc is home but inbound wikilinks still point at the destination. patch_retained = the doc is home but carries the patched frontmatter. Find it in Loki: {app=\"ca\"} |= \"rollback\" |= \"manual reconciliation\" — that line carries vault, sourcePath, dest, and both the original and rollback causes."

      # The compensator's own bookkeeping threw (its logging or metric path), so
      # the outcome reported above may be incomplete — this says "trust the
      # other signal less", not "the vault is broken". Also primed at zero, and
      # on the same 24h window as its sibling so one incident's two alerts
      # resolve together rather than 23 hours apart.
      - alert: CaBrainRollbackReportFailed
        expr: sum by (op) (increase(ca_brain_rollback_report_failed_total[24h])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Brain rollback bookkeeping failed in ca ({{ $labels.op }})"
          description: "ca's {{ $labels.op }} rollback completed but its own logging/metric path threw {{ $value | humanize }} time(s) in the last 24h — the reported rollback outcome may be incomplete, and some rollback_failed increments may be missing. Check the ca logs around the event for a truncated rollback trace."

  - name: ca_sdk_spurious_deny
    interval: 1m
    rules:
      # Verdict alert for the claude-agent-sdk 0.3.195 pin (ca #1915, #1914).
      # ca.query.spurious_deny_retried{outcome} counts tool calls spuriously
      # auto-denied by the upstream SDK permission-broker bug
      # (anthropics/claude-code#54393) despite bypassPermissions. The pin to
      # 0.3.195 is believed to stop these; the counter is primed with zeros
      # at daemon boot (channel_id="_startup") precisely so this series
      # EXISTS at zero and an increase is meaningful. ANY increase post-pin
      # means the version-correlation premise was wrong — the string-match
      # retry workaround (ca #1884) is papering over live denials and the
      # pin decision needs revisiting (see CLAUDE.md §Quirks + ca #1913).
      # outcome ∈ retried|nudge_failed|gave_up|dropped_subagent|suppressed_abort;
      # dropped_subagent is the worst signal (those denials are never
      # retried — the sub-agent silently believes the boss refused).
      - alert: CaSpuriousDenyActive
        expr: sum by (outcome) (increase(ca_query_spurious_deny_retried_total{channel_id!="_startup"}[30m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Spurious SDK permission denies firing in ca (outcome={{ $labels.outcome }})"
          description: "{{ $value | humanize }} spurious SDK deny event(s) with outcome '{{ $labels.outcome }}' in the last 30m — the 0.3.195 pin did NOT stop the upstream permission-broker bug (or it regressed). See ca PR #1915 / issues #1913, #1914 and the post-mortem braindoc initiatives/code/ca/ca-sdk-spurious-deny-pin-2026-07.md."

  - name: sauron_prometheus
    interval: 1m
    rules:
      # Prometheus too many targets down. Expr is a 0..1 ratio so
      # humanizePercentage renders it correctly (e.g. 0.1429 → "14.29%").
      # Previously the expr pre-multiplied by 100, so humanizePercentage
      # multiplied again and printed nonsense like "1429%".
      - alert: PrometheusTargetsDown
        expr: count(up == 0) / count(up) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 10% of Prometheus targets are down"
          description: "{{ $value | humanizePercentage }} of targets are unreachable"

      # Prometheus config reload failed
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus configuration reload failed"
          description: "Prometheus configuration reload has failed. Check prometheus logs."
