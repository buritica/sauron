# Sauron - The All-Seeing Eye
# Infrastructure monitoring and observability stack

x-common-settings: &common-settings
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: 384M
      reservations:
        cpus: "0.1"
        memory: 64M

# Lightweight exporters and agents
x-light-settings: &light-settings
  <<: *common-settings
  deploy:
    resources:
      limits:
        cpus: "0.15"
        memory: 128M
      reservations:
        cpus: "0.05"
        memory: 32M

services:
  # Grafana Alloy — the ONLY telemetry collector left on halfmoon (replaces
  # prometheus + loki + promtail + tempo + otel-collector + alertmanager, see
  # the "Grafana Cloud migration" README section). Scrapes node-exporter +
  # cadvisor for metrics, replicates promtail's docker/file log jobs, forwards
  # both to Grafana Cloud. ca's own telemetry does NOT flow through here — it
  # pushes OTLP directly to Cloud.
  #
  # DISABLED (config.alloy is fully commented out) until Cloud credentials
  # exist — see config/alloy/config.alloy's header for activation steps.
  # Volumes mirror exactly what promtail mounted (same log sources, same
  # paths) plus config.alloy itself.
  alloy:
    container_name: alloy
    image: grafana/alloy:latest
    networks:
      - sauron
    ports:
      - "12345:12345"   # Alloy's own UI/API — component graph, live debugging
    environment:
      - TZ=Etc/UTC
    volumes:
      - ./config/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /Users/buritica/deploy:/host/deploy:ro
      - /Users/buritica/actions-runner-ca/_diag:/host/runner-ca/diag:ro
      - /Users/buritica/var/log:/host/var-log:ro
    command:
      - 'run'
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '/etc/alloy/config.alloy'
    <<: *common-settings

  # Grafana - Visualization and dashboards
  # Post-migration this is an OPTIONAL local mirror — Grafana Cloud has its
  # own hosted Grafana UI with the same dashboards. Kept for now (Tailscale-
  # only local access, works without a Cloud login); drop it if that's not
  # worth the container. Its dashboards need their Prometheus datasource
  # repointed at Cloud's query endpoint instead of localhost:9090 — there's
  # no local Prometheus for it to query anymore.
  grafana:
    container_name: grafana
    image: grafana/grafana:11.5.2
    networks:
      - sauron
    ports:
      - "3030:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/provisioning/dashboard-files:/etc/grafana/provisioning/dashboard-files:ro
    environment:
      - TZ=Etc/UTC
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-sauron_sees_all}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://sauron.buriti.ca
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_AUTH_BASIC_ENABLED=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    <<: *common-settings

  # cAdvisor - Container metrics exporter
  # OrbStack notes:
  #   1. Host bind mounts (/, /sys, /var/lib/docker, /dev/disk) transparently
  #      resolve to the OrbStack Linux VM's paths — NOT macOS — so they still
  #      give cAdvisor the cgroupfs + docker layout it needs.
  #   2. OrbStack runs docker on top of a containerd snapshotter (`docker info`
  #      → Storage Driver: overlayfs, driver-type:
  #      io.containerd.snapshotter.v1). cAdvisor's docker factory hard-requires
  #      a containerd client for registration, so we point --containerd at
  #      OrbStack's docker containerd socket via /rootfs. Docker Compose
  #      won't bind /run/docker/containerd/ directly — it treats the source as
  #      a macOS path, finds nothing, and mounts an empty dir.
  #   3. Image pinned to v0.55.1 — earlier releases fail container creation on
  #      OrbStack because they look for docker's overlay2 layerdb, which the
  #      containerd snapshotter doesn't produce. v0.55.x tolerates its absence.
  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    networks:
      - sauron
    ports:
      - "8083:8080"
    environment:
      - TZ=Etc/UTC
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # Merged fixes:
    # - --containerd (OrbStack): docker factory needs a containerd client to
    #   register; OrbStack's docker containerd socket lives at
    #   /run/docker/containerd/containerd.sock in the VM, reached via /rootfs.
    # - --disable_metrics=disk,diskIO,…: cadvisor was choking on per-container
    #   filesystem du/inode scans (minutes-long on a busy overlayfs after the
    #   disk-full incident), hanging :8080 → ServiceDown/ContainerDown flapping.
    #   Host disk still comes from node-exporter (which is what the disk alerts
    #   use), so disabling here is safe. Kernel/host-only classes (advtcp,
    #   hugetlb, memory_numa, percpu, referenced_memory, resctrl, sched, tcp,
    #   udp) never populate under Docker anyway.
    # - --docker_only: skip non-docker cgroups (the OrbStack VM's /.lxc etc.).
    # - --housekeeping_interval 30s: sample far less aggressively than the 1s
    #   default; matches Alloy's ~15s scrape cadence.
    #
    # Kept as a STANDALONE container rather than folded into Alloy's
    # prometheus.exporter.cadivsor (which does exist and could replace this)
    # — deliberately, for now: this config is the product of a real incident
    # (choking on overlayfs scans, hanging :8080, false ServiceDown cascades)
    # and Alloy's embedded cAdvisor fork has its own separate compatibility
    # history. Fold it in as a follow-up once the core Alloy→Cloud pipeline is
    # proven working — not in the same change that's also standing up Cloud
    # connectivity for the first time.
    command:
      - '--containerd=/rootfs/run/docker/containerd/containerd.sock'
      - '--disable_metrics=disk,diskIO,advtcp,hugetlb,memory_numa,percpu,referenced_memory,resctrl,sched,tcp,udp'
      - '--docker_only=true'
      - '--housekeeping_interval=30s'
    privileged: true
    devices:
      - /dev/kmsg
    <<: *common-settings

  # Node Exporter - Host system metrics
  # Same "kept standalone for now" reasoning as cadvisor above — Alloy's
  # prometheus.exporter.unix could replace this, deferred to the same
  # follow-up. Also note: this containerized instance only sees the
  # Colima/OrbStack VM's disk, not real macOS APFS — that's what the native
  # brew-installed node_exporter (scraped at host.docker.internal:9100 in
  # config/alloy/config.alloy's halfmoon_host job) is for, and folding THIS
  # container into Alloy would not remove the need for that native install.
  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:latest
    networks:
      - sauron
    ports:
      - "9100:9100"
    environment:
      - TZ=Etc/UTC
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    <<: *light-settings

networks:
  sauron:
    driver: bridge
